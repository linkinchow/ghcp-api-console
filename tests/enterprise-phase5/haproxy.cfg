global
  log stdout format raw local0
  maxconn 256

defaults
  mode http
  log global
  timeout connect 3s
  timeout client 70s
  timeout server 70s
  # No POST replay, including after a backend transport failure.
  retries 0
  no option redispatch
  option http-keep-alive

resolvers docker
  nameserver embedded 127.0.0.11:53
  resolve_retries 2
  timeout resolve 1s
  timeout retry 1s
  hold valid 3s

frontend service
  bind :3000
  default_backend proxies

backend proxies
  balance roundrobin
  option httpchk GET /readyz
  http-check expect status 200
  default-server inter 2s fall 2 rise 2 resolvers docker init-addr libc,none
  server proxy-1 proxy-1:3000 check
  server proxy-2 proxy-2:3000 check
  server proxy-3 proxy-3:3000 check
