# Test only (kind), shared by kind-ghe and kind-dba. Must come after components/network-policy.
# - local r2 image tags instead of the Docker Hub digests (the cluster never pulls from Docker Hub);
# - mock host names (hostAliases to the mock Service's fixed ClusterIP);
# - network-policy placeholders: ghcp-e2e-caller plays LiteLLM and, without an Ingress controller in kind,
#   the Ingress controller namespace; egress to the mock (port 8002) stands in for GitHub / Copilot on 443;
# - the MySQL CIDR is set to the marker 198.51.100.77/32, which kind-e2e.mjs replaces with the external MySQL
#   container's address on the kind Docker network after rendering.
# The `test` operations make the build fail if the component's rule order or placeholders change.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - allow-mock-egress.yaml

images:
  - name: docker.io/linkinchow/ghcp-proxy
    newName: ghcp-release-proxy
    newTag: multi-4922a4a-amd64-r2
  - name: docker.io/linkinchow/ghcp-sso
    newName: ghcp-release-sso
    newTag: multi-4922a4a-amd64-r2
  - name: docker.io/linkinchow/ghcp-login
    newName: ghcp-release-login
    newTag: multi-4922a4a-amd64-r2
  - name: docker.io/linkinchow/ghcp-console
    newName: ghcp-release-console
    newTag: multi-4922a4a-amd64-r2

patches:
  - path: mock-host-aliases.yaml
  - target:
      kind: NetworkPolicy
      name: ghcp-proxy
    patch: |-
      - op: test
        path: /spec/ingress/0/from/0/namespaceSelector/matchLabels/kubernetes.io~1metadata.name
        value: REPLACE_LITELLM_NAMESPACE
      - op: replace
        path: /spec/ingress/0/from/0/namespaceSelector/matchLabels/kubernetes.io~1metadata.name
        value: ghcp-e2e-caller
      - op: test
        path: /spec/ingress/0/from/0/podSelector/matchLabels/app.kubernetes.io~1name
        value: REPLACE_LITELLM_APP_LABEL
      - op: replace
        path: /spec/ingress/0/from/0/podSelector/matchLabels/app.kubernetes.io~1name
        value: litellm-sim
      - op: test
        path: /spec/egress/2/to/0/ipBlock/cidr
        value: 192.0.2.10/32
      - op: replace
        path: /spec/egress/2/to/0/ipBlock/cidr
        value: 198.51.100.77/32
  - target:
      kind: NetworkPolicy
      name: ghcp-sso
    patch: |-
      - op: test
        path: /spec/ingress/0/from/1/namespaceSelector/matchLabels/kubernetes.io~1metadata.name
        value: REPLACE_INGRESS_NAMESPACE
      - op: replace
        path: /spec/ingress/0/from/1/namespaceSelector/matchLabels/kubernetes.io~1metadata.name
        value: ghcp-e2e-caller
  - target:
      kind: NetworkPolicy
      name: ghcp-login
    patch: |-
      - op: test
        path: /spec/egress/2/to/0/namespaceSelector/matchLabels/kubernetes.io~1metadata.name
        value: REPLACE_INGRESS_NAMESPACE
      - op: replace
        path: /spec/egress/2/to/0/namespaceSelector/matchLabels/kubernetes.io~1metadata.name
        value: ghcp-e2e-caller
  - target:
      kind: NetworkPolicy
      name: ghcp-console
    patch: |-
      - op: test
        path: /spec/ingress/0/from/0/namespaceSelector/matchLabels/kubernetes.io~1metadata.name
        value: REPLACE_INTERNAL_INGRESS_NAMESPACE
      - op: replace
        path: /spec/ingress/0/from/0/namespaceSelector/matchLabels/kubernetes.io~1metadata.name
        value: ghcp-e2e-caller
