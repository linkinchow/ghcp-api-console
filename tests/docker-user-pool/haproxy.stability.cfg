global
    maxconn 512

defaults
    mode http
    timeout connect 3s
    timeout client 65s
    timeout server 65s
    timeout check 2s
    retries 0

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 2s

frontend business
    bind :8080
    acl supported path -i /readyz /v1/models /v1/messages /v1/messages/count_tokens /chat/completions /responses
    http-request deny unless supported
    default_backend proxies

frontend internal
    bind :8081
    acl supported path_beg /api/ /internal/
    acl supported path -i /readyz
    http-request deny unless supported
    default_backend proxies

frontend inspection
    bind :8082
    monitor-uri /healthz
    stats enable
    stats uri /stats

backend proxies
    balance roundrobin
    option httpchk
    http-check send meth GET uri /readyz
    http-check expect status 200
    http-response set-header X-Fixture-Backend %[srv_name]
    default-server inter 1s fall 2 rise 2
    server proxy proxy:3000 check resolvers docker init-addr libc,none
    server proxy2 proxy2:3000 check resolvers docker init-addr libc,none
