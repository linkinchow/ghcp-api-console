model_list:
  - model_name: claude-opus-5
    litellm_params:
      model: anthropic/claude-opus-5
      api_base: http://proxy:3000
      api_key: os.environ/GHCP_PROXY_API_KEY
      max_retries: 0
    model_info:
      id: pool-claude-opus-5
  - model_name: other-only
    litellm_params:
      model: anthropic/claude-opus-5
      api_base: http://mock:8002/other
      api_key: local-other-provider-test-only
      max_retries: 0
    model_info:
      id: other-claude-opus-5
  - model_name: shared-claude
    litellm_params:
      model: anthropic/claude-opus-5
      api_base: http://proxy:3000
      api_key: os.environ/GHCP_PROXY_API_KEY
      max_retries: 0
    model_info:
      id: shared-pool-claude
  - model_name: shared-claude
    litellm_params:
      model: anthropic/claude-opus-5
      api_base: http://mock:8002/other
      api_key: local-other-provider-test-only
      max_retries: 0
    model_info:
      id: shared-other-claude
  - model_name: fallback-probe
    litellm_params:
      model: anthropic/claude-opus-5
      api_base: http://mock:8002/other
      # Intentionally rejected by the local fixture, to exercise fallback into GHCP.
      api_key: local-other-deliberately-invalid
      max_retries: 0
    model_info:
      id: local-failing-primary
litellm_settings:
  callbacks:
    - user_pool_hook.proxy_handler_instance
  cache: false
  telemetry: false
  request_timeout: 30
router_settings:
  fallbacks:
    - fallback-probe: [claude-opus-5]
  num_retries: 0
  allowed_fails: 1000
  cooldown_time: 1
  disable_cooldowns: true
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  background_health_checks: false
