# GHCP Proxy 多企业版（multi-f43f27e-amd64-r3）的 Azure 部署。说明见 README.md。
#
# azd 只负责环境管理与基础设施（infra/main.bicep + main.bicepparam）。没有 azd service：
# 应用由 hooks/deploy-app.ps1 用 kubectl 部署，使用本项目自己的 kubeconfig（.kube/，不入库），
# 不合并进、也不切换操作者默认 kubeconfig 的上下文（azd 的 AKS 服务部署会这样做）。
name: ghcp-proxy-azure
metadata:
  template: ghcp-proxy-azure@1.0.0

infra:
  provider: bicep
  path: infra
  module: main

hooks:
  preprovision:
    windows:
      shell: pwsh
      run: ./hooks/preprovision.ps1
      interactive: false
      continueOnError: false
    posix:
      shell: pwsh
      run: ./hooks/preprovision.ps1
      interactive: false
      continueOnError: false
  postprovision:
    windows:
      shell: pwsh
      run: ./hooks/postprovision.ps1
      interactive: false
      continueOnError: false
    posix:
      shell: pwsh
      run: ./hooks/postprovision.ps1
      interactive: false
      continueOnError: false
  predown:
    windows:
      shell: pwsh
      run: ./hooks/predown.ps1
      interactive: false
      continueOnError: false
    posix:
      shell: pwsh
      run: ./hooks/predown.ps1
      interactive: false
      continueOnError: false
