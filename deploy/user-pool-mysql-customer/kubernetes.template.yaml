# Kubernetes 升级模板：先配置、导入，再启动1个Proxy，验证后扩容。
# 替换所有 REPLACE_*。保留现有Service名称和端口，不删除重建原Service。
# 不包含MySQL、Secret/PVC或SSO/Login/Console部署；这些复用现有资源。
apiVersion: v1
kind: ConfigMap
metadata:
  name: ghcp-pool-proxy-config
  namespace: REPLACE_NAMESPACE
data:
  PORT: "3000"
  ACCOUNT_ROUTING_MODE: caller-lease
  STORAGE_DRIVER: mysql
  MYSQL_CONNECTION_LIMIT: "10"
  MYSQL_SSL_MODE: verify-ca
  MYSQL_SSL_CA_PATH: /run/mysql-ca/ca.pem
  # 与迁移进程使用相同的域名、模型和原池不变量，不在升级时顺便调参。
  POOL_ACCOUNT_EMAIL_DOMAIN: REPLACE_POOL_DOMAIN
  POOL_WARMUP_MODEL: REPLACE_WARMUP_MODEL
  PROVISIONAL_LEASE_TTL_SECONDS: "300"
  PREWARM_POLL_SECONDS: "5"
  PREWARM_CONCURRENCY: "5"
  POOL_LOGIN_MAX_PENDING: "5"
  POOL_EXHAUSTED_RETRY_AFTER_SECONDS: "30"
  POOL_REQUEST_TIMEOUT_SECONDS: "120"
  # 可选：仅新版Proxy推理请求预算；旧参数及MySQL指纹不变。先完成版本验证再启用。
  # POOL_INFERENCE_TIMEOUT_SECONDS: "600"
  # 仅首次初始化种子，已有settings从SQLite导入，不由这些env覆盖。
  READY_IDLE_TARGET: "0"
  POOL_MAX_ACCOUNTS: "100"
  CALLER_LEASE_TTL_SECONDS: "172800"
  REQUEST_STATS_PER_ACCOUNT_LIMIT: REPLACE_STATS_RETENTION
  SSO_BASE_URL: REPLACE_EXISTING_SSO_SERVICE_ROOT
  LOGIN_BASE_URL: REPLACE_EXISTING_LOGIN_SERVICE_ROOT
  # 以下两项（及上面的POOL_*）合成 default 企业。registry文件若也写了 default 的同名字段，
  # 两边必须相同，否则启动报 enterprise_env_conflict；见 docs/multi-enterprise-registry.md。
  ENTERPRISE_SHORTCODE: REPLACE_EXISTING_ENTERPRISE_SHORTCODE
  COPILOT_API_BASE_URL: REPLACE_EXISTING_COPILOT_API_ROOT
  # 多企业版：其他副本等待迁移锁的秒数（1–3600，默认30）。大统计表首次升级可调高，
  # 或由DBA先执行 scripts/proxy-mysql-enterprise-upgrade.sql。
  MYSQL_MIGRATION_LOCK_WAIT_SECONDS: "30"
  # 多企业版，仅直连模式：新 identity 归属的企业（默认 default）。
  # DIRECT_MODE_ENTERPRISE_ID: default
  # 多企业版，可选：企业 registry（只读挂载，见下方 volumes）。不设置时行为与单企业相同。
  # ENTERPRISE_REGISTRY_FILE: /config/enterprise-registry.json
  PROXY_ERROR_DIAGNOSTICS_ENABLED: "false"
  PROXY_ERROR_DIAGNOSTICS_REDACT: "true"
  # 人工启动门禁，不是产品的暂停开关。导入并核对paused=1/target=0后才改成"true"。
  CUSTOMER_PAUSED_DATABASE_APPROVED: BLOCKED
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ghcp-pool-companion-routing
  namespace: REPLACE_NAMESPACE
data:
  # 供原SSO/Login/Console部署引用；不会自动修改现有Deployment。
  PROXY_BASE_URL: http://REPLACE_EXISTING_PROXY_SERVICE:REPLACE_EXISTING_SERVICE_PORT
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghcp-pool-proxy
  namespace: REPLACE_NAMESPACE
spec:
  replicas: 1
  revisionHistoryLimit: 2
  # 单企业 → 多企业的首次升级必须 Recreate：旧版与已迁移的库不兼容（写入失败、启动被拒），
  # 不能与新版混跑。同时停掉SSO/Login/Console旧版，四个组件一起换镜像
  # （docs/multi-enterprise-upgrade-guide.md）。首次升级验证完成后，同一多企业版本线内
  # 的Proxy更新可改回 RollingUpdate（maxSurge: 1，maxUnavailable: 0）。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ghcp-pool-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ghcp-pool-proxy
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      # 希望Pod跨节点分散；应结合实际节点数确认，而非仅依赖调度偏好。
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ghcp-pool-proxy
      # 私有镜像需要时，在此补imagePullSecrets。
      initContainers:
        - name: require-approved-paused-database
          image: REPLACE_PROXY_IMAGE
          command:
            - node
            - -e
            - "if(process.env.CUSTOMER_PAUSED_DATABASE_APPROVED !== 'true'){console.error('Verify imported paused database before startup');process.exit(1)}"
          env:
            - name: CUSTOMER_PAUSED_DATABASE_APPROVED
              valueFrom:
                configMapKeyRef:
                  name: ghcp-pool-proxy-config
                  key: CUSTOMER_PAUSED_DATABASE_APPROVED
      containers:
        - name: proxy
          image: REPLACE_PROXY_IMAGE
          imagePullPolicy: IfNotPresent
          # No command override: the image runs Tini as PID 1, which forwards SIGTERM to node.
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: ghcp-pool-proxy-config
          env:
            - name: MYSQL_URL
              valueFrom:
                secretKeyRef:
                  name: REPLACE_PROXY_SECRET
                  key: MYSQL_URL
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: REPLACE_PROXY_SECRET
                  key: API_KEY
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: REPLACE_PROXY_SECRET
                  key: INTERNAL_API_TOKEN
            - name: PROXY_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          resources:
            requests:
              cpu: REPLACE_CPU_REQUEST
              memory: REPLACE_MEMORY_REQUEST
            limits:
              cpu: REPLACE_CPU_LIMIT
              memory: REPLACE_MEMORY_LIMIT
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            timeoutSeconds: 6
            periodSeconds: 10
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 6
          # Proxy完成迁移后才监听端口；本探测共约300秒。大库首次升级预计更久时调高failureThreshold。
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 30
          lifecycle:
            preStop:
              exec:
                command: [node, -e, "setTimeout(() => {}, 10000)"]
          volumeMounts:
            - name: mysql-ca
              mountPath: /run/mysql-ca
              readOnly: true
            # 多企业 registry：Proxy、SSO、Login 挂载同一文件（只读）。
            # - name: enterprise-registry
            #   mountPath: /config
            #   readOnly: true
            # registry 中 Proxy 用到的 {"file": ...} secret（如 Models 管理员 token）同样只读挂载。
            # - name: contoso-ghe-secrets
            #   mountPath: /run/secrets/contoso-ghe
            #   readOnly: true
      volumes:
        - name: mysql-ca
          configMap:
            name: REPLACE_MYSQL_CA_CONFIGMAP
            items:
              - key: ca.pem
                path: ca.pem
        # - name: enterprise-registry
        #   configMap:
        #     name: REPLACE_ENTERPRISE_REGISTRY_CONFIGMAP
        #     items:
        #       - key: enterprise-registry.json
        #         path: enterprise-registry.json
        # - name: contoso-ghe-secrets
        #   secret:
        #     secretName: REPLACE_CONTOSO_GHE_SECRET
---
# 此对象是切换时的字段参考。将selector/targetPort合并到原Service，保留其名称/IP/端口。
# 先启动并验证新Proxy，再切换；不要把整个模板一次性apply到正在运行的环境。
apiVersion: v1
kind: Service
metadata:
  name: REPLACE_EXISTING_PROXY_SERVICE
  namespace: REPLACE_NAMESPACE
spec:
  type: ClusterIP
  sessionAffinity: None
  selector:
    app.kubernetes.io/name: ghcp-pool-proxy
  ports:
    - name: http
      port: 3000 # 改为现有Service端口，不能擅自改变客户端入口。
      targetPort: http
      protocol: TCP
