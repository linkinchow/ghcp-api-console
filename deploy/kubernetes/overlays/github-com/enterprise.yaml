# github.com：GITHUB_BASE_URL 留空（即 https://github.com），必须填写实际的企业 shortcode。
apiVersion: v1
kind: ConfigMap
metadata:
  name: ghcp-enterprise
data:
  GITHUB_BASE_URL: ""
  # 留空时代码使用内置值 octo 且不报错，所以必须填写；有数据后不能修改。
  ENTERPRISE_SHORTCODE: REPLACE_ENTERPRISE_SHORTCODE
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ghcp-sso-config
data:
  SP_ENTITY_ID: https://github.com/enterprises/REPLACE_ENTERPRISE_SLUG
  SP_ACS_URL: https://github.com/enterprises/REPLACE_ENTERPRISE_SLUG/saml/consume
  SCIM_BASE_URL: https://api.github.com/scim/v2/enterprises/REPLACE_ENTERPRISE_SLUG
