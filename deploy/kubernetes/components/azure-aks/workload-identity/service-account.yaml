# Workload Identity：四个服务共用的 ServiceAccount，绑定 Bicep 创建的用户分配托管标识
# （federated credential 的 subject 为 system:serviceaccount:<namespace>:ghcp-workload，必须与这里一致）。
#
# 用途只有一个：Secrets Store CSI 驱动以该 ServiceAccount 的身份换取 Entra token 读取 Key Vault。
# Pod 不带 azure.workload.identity/use 标签、仍不挂载 ServiceAccount token（base 的
# automountServiceAccountToken: false 不变）：CSI 驱动自己向 kubelet 申请 token，应用进程拿不到任何 Azure 凭据。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ghcp-workload
  labels:
    app.kubernetes.io/name: ghcp-workload
  annotations:
    azure.workload.identity/client-id: REPLACE_WORKLOAD_CLIENT_ID
    azure.workload.identity/tenant-id: REPLACE_TENANT_ID
automountServiceAccountToken: false
