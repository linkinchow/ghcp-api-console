# Key Vault → Pod：每个服务一个 SecretProviderClass，只挂载自己需要的机密；同时由 secretObjects 同步出
# base 按名称引用的 Kubernetes Secret（名称、键与 ../../secret.example.yaml 完全一致），base 不需要任何改动。
#
# Key Vault 中的机密名（固定约定，deploy/azure 的 hook、README 使用同样的名字）：
#   ghcp-internal-api-token        → ghcp-internal / INTERNAL_API_TOKEN        （hook 生成）
#   ghcp-session-secret            → ghcp-internal / SESSION_SECRET            （hook 生成）
#   ghcp-proxy-api-key             → ghcp-proxy    / API_KEY                   （hook 生成；只配置给 LiteLLM）
#   ghcp-mysql-url                 → ghcp-proxy    / MYSQL_URL                 （hook 生成，含 Proxy 账号密码）
#   ghcp-scim-token                → ghcp-sso      / SCIM_TOKEN                （运维写入）
#   ghcp-copilot-seat-pat          → ghcp-sso      / GITHUB_COPILOT_SEAT_PAT   （运维写入）
#   ghcp-sso-default-user-password → ghcp-sso      / SSO_DEFAULT_USER_PASSWORD （hook 生成）
#   ghcp-saml-idp-cert             → ghcp-sso-saml / idp-cert.pem              （运维写入）
#   ghcp-saml-idp-key              → ghcp-sso-saml / idp-key.pem               （运维写入）
#
# 注意：
# - 同名 Secret 由第一个挂载它的 Pod 创建（CSI 驱动只在不存在时创建），所以 ghcp-internal 在每个
#   SecretProviderClass 中都包含两个键，保证无论哪个服务先启动，内容都完整。
# - 同步出的 Secret 在最后一个挂载它的 Pod 删除后被回收，下次启动重新创建；这是 CSI 驱动的设计。
# - 机密轮换（AKS 插件 enableSecretRotation）只更新挂载文件和同步的 Secret；环境变量在 Pod 重启后才变化，
#   轮换后执行 kubectl rollout restart（deploy/azure/README.md 第 6 节）。
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: ghcp-proxy-kv
  labels:
    app.kubernetes.io/name: ghcp-proxy
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: REPLACE_WORKLOAD_CLIENT_ID
    keyvaultName: REPLACE_KEY_VAULT_NAME
    tenantId: REPLACE_TENANT_ID
    cloudName: ""
    objects: |
      array:
        - |
          objectName: ghcp-internal-api-token
          objectType: secret
          objectAlias: INTERNAL_API_TOKEN
        - |
          objectName: ghcp-session-secret
          objectType: secret
          objectAlias: SESSION_SECRET
        - |
          objectName: ghcp-proxy-api-key
          objectType: secret
          objectAlias: API_KEY
        - |
          objectName: ghcp-mysql-url
          objectType: secret
          objectAlias: MYSQL_URL
  secretObjects:
    - secretName: ghcp-internal
      type: Opaque
      data:
        - objectName: INTERNAL_API_TOKEN
          key: INTERNAL_API_TOKEN
        - objectName: SESSION_SECRET
          key: SESSION_SECRET
    - secretName: ghcp-proxy
      type: Opaque
      data:
        - objectName: API_KEY
          key: API_KEY
        - objectName: MYSQL_URL
          key: MYSQL_URL
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: ghcp-sso-kv
  labels:
    app.kubernetes.io/name: ghcp-sso
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: REPLACE_WORKLOAD_CLIENT_ID
    keyvaultName: REPLACE_KEY_VAULT_NAME
    tenantId: REPLACE_TENANT_ID
    cloudName: ""
    objects: |
      array:
        - |
          objectName: ghcp-internal-api-token
          objectType: secret
          objectAlias: INTERNAL_API_TOKEN
        - |
          objectName: ghcp-session-secret
          objectType: secret
          objectAlias: SESSION_SECRET
        - |
          objectName: ghcp-scim-token
          objectType: secret
          objectAlias: SCIM_TOKEN
        - |
          objectName: ghcp-copilot-seat-pat
          objectType: secret
          objectAlias: GITHUB_COPILOT_SEAT_PAT
        - |
          objectName: ghcp-sso-default-user-password
          objectType: secret
          objectAlias: SSO_DEFAULT_USER_PASSWORD
        - |
          objectName: ghcp-saml-idp-cert
          objectType: secret
          objectAlias: idp-cert.pem
        - |
          objectName: ghcp-saml-idp-key
          objectType: secret
          objectAlias: idp-key.pem
  secretObjects:
    - secretName: ghcp-internal
      type: Opaque
      data:
        - objectName: INTERNAL_API_TOKEN
          key: INTERNAL_API_TOKEN
        - objectName: SESSION_SECRET
          key: SESSION_SECRET
    - secretName: ghcp-sso
      type: Opaque
      data:
        - objectName: SCIM_TOKEN
          key: SCIM_TOKEN
        - objectName: GITHUB_COPILOT_SEAT_PAT
          key: GITHUB_COPILOT_SEAT_PAT
        - objectName: SSO_DEFAULT_USER_PASSWORD
          key: SSO_DEFAULT_USER_PASSWORD
    - secretName: ghcp-sso-saml
      type: Opaque
      data:
        - objectName: idp-cert.pem
          key: idp-cert.pem
        - objectName: idp-key.pem
          key: idp-key.pem
---
