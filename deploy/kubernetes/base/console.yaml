# Console：管理界面。唯一的管理员保存在 /data/admins.json（文件丢失即回到“未初始化”），只能单实例。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghcp-console
  labels:
    app.kubernetes.io/name: ghcp-console
    app.kubernetes.io/component: console
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ghcp-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ghcp-console
        app.kubernetes.io/component: console
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: require-approved-config
          image: ghcp-console
          imagePullPolicy: IfNotPresent
          command:
            - node
            - -e
            - >-
              const bad = Object.keys(process.env).filter((k) => String(process.env[k]).includes('REPLACE_')).sort();
              if (bad.length) { console.error('[config-gate] placeholders not replaced: ' + bad.join(', ')); process.exit(1); }
              if (process.env.GHCP_CONFIG_APPROVED !== 'true') {
              console.error('[config-gate] GHCP_CONFIG_APPROVED is not "true": review the configuration first (deploy/kubernetes/README.md)');
              process.exit(1); }
              console.log('[config-gate] configuration approved');
          envFrom: &consoleEnvFrom
            - configMapRef:
                name: ghcp-common
            - configMapRef:
                name: ghcp-console-config
          env: &consoleEnv
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ghcp-internal
                  key: INTERNAL_API_TOKEN
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: ghcp-internal
                  key: SESSION_SECRET
          terminationMessagePolicy: FallbackToLogsOnError
          securityContext: &restricted
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      containers:
        - name: console
          image: ghcp-console
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 7004
          envFrom: *consoleEnvFrom
          env: *consoleEnv
          securityContext: *restricted
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 6
          lifecycle:
            preStop:
              exec:
                command: [node, -e, "setTimeout(() => {}, 10000)"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ghcp-console-data
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ghcp-console
  labels:
    app.kubernetes.io/name: ghcp-console
    app.kubernetes.io/component: console
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ghcp-console
  ports:
    - name: http
      port: 7004
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ghcp-console-data
  labels:
    app.kubernetes.io/name: ghcp-console
    app.kubernetes.io/component: console
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
