# GHCP 多企业版 multi-ea1a29e-amd64-r4 全新部署的 Kustomize base（四个服务 + 外部 MySQL）。
# 不能单独 apply：企业变量（github.com / GHE.com）由 overlays/ 提供；所有 REPLACE_* 在私有副本中替换。
# Secret 只按名称引用，值不在仓库里（见 ../secret.example.yaml 与 ../README.md）。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ghcp

labels:
  - pairs:
      app.kubernetes.io/part-of: ghcp
    includeSelectors: false
    # Pod 也带上该标签：components/network-policy 按它选择本应用的 Pod。
    includeTemplates: true

resources:
  - config.yaml
  - proxy.yaml
  - sso.yaml
  - login.yaml
  - console.yaml

# 已发布的 r2 镜像，按 Docker Hub manifest digest 引用（docs/multi-enterprise-release-validation.md）。
# 同步到自己的镜像仓库时，在 overlay 中只改 newName，digest 保持不变（复制时保留 manifest）。
images:
  - name: ghcp-proxy
    newName: docker.io/linkinchow/ghcp-proxy
    digest: sha256:98c4c720db3189d53536885cfd1e521954f3b2989333e27784d6387edad63dec
  - name: ghcp-sso
    newName: docker.io/linkinchow/ghcp-sso
    digest: sha256:12d60ca0b55e593bb5163d044b906640f033b9a2e767568dea7fb30ac8a35919
  - name: ghcp-login
    newName: docker.io/linkinchow/ghcp-login
    digest: sha256:4481f51701fc23c8f78b1bbe4e4c6eb41b0fe9fc6b4d5e8ae897f9add1263bec
  - name: ghcp-console
    newName: docker.io/linkinchow/ghcp-console
    digest: sha256:91a02afbbba6913a81ab252213a632508cd68610cf6d73d99543b6e731f12fb8
