# GHCP 多企业版 multi-f43f27e-amd64-r3 全新部署的 Kustomize base（四个服务 + 外部 MySQL）。
# 不能单独 apply：企业变量（github.com / GHE.com）由 overlays/ 提供；所有 REPLACE_* 在私有副本中替换。
# Secret 只按名称引用，值不在仓库里（见 ../secret.example.yaml 与 ../README.md）。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ghcp

labels:
  - pairs:
      app.kubernetes.io/part-of: ghcp
    includeSelectors: false
    # Pod 也带上该标签：components/network-policy 按它选择本应用的 Pod。
    includeTemplates: true

resources:
  - config.yaml
  - proxy.yaml
  - sso.yaml
  - login.yaml
  - console.yaml

# 已发布的 r2 镜像，按 Docker Hub manifest digest 引用（docs/multi-enterprise-release-validation.md）。
# 同步到自己的镜像仓库时，在 overlay 中只改 newName，digest 保持不变（复制时保留 manifest）。
images:
  - name: ghcp-proxy
    newName: docker.io/linkinchow/ghcp-proxy
    digest: sha256:14ed9384f57a95c5cb4c1a5bd34d10d722d89d4e8ba9b3b49fcd6e32e41ad5f3
  - name: ghcp-sso
    newName: docker.io/linkinchow/ghcp-sso
    digest: sha256:93e5be2c5fd8a9166cd67897c52466b833b9bbb12e2eede9dbe7700204b31214
  - name: ghcp-login
    newName: docker.io/linkinchow/ghcp-login
    digest: sha256:96408b4fc3b0d0cd76083cc4bb8a1dcaf91ffa56152a8f7603caa1cc1a968338
  - name: ghcp-console
    newName: docker.io/linkinchow/ghcp-console
    digest: sha256:6526394ff321ab15a4222423013689eb4959dc465dbec6262aa0a84ae267cc90
