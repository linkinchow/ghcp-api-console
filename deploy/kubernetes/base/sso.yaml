# SSO：SAML IdP + SCIM + Copilot 席位。数据在 SQLite（/data），只能单实例。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghcp-sso
  labels:
    app.kubernetes.io/name: ghcp-sso
    app.kubernetes.io/component: sso
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # SQLite 不能被两个 Pod 同时打开：先停旧 Pod 再起新 Pod（RollingUpdate 会短暂出现两个）。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ghcp-sso
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ghcp-sso
        app.kubernetes.io/component: sso
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: require-approved-config
          image: ghcp-sso
          imagePullPolicy: IfNotPresent
          command:
            - node
            - -e
            - >-
              const bad = Object.keys(process.env).filter((k) => String(process.env[k]).includes('REPLACE_')).sort();
              if (bad.length) { console.error('[config-gate] placeholders not replaced: ' + bad.join(', ')); process.exit(1); }
              if (process.env.GHCP_CONFIG_APPROVED !== 'true') {
              console.error('[config-gate] GHCP_CONFIG_APPROVED is not "true": review the configuration first (deploy/kubernetes/README.md)');
              process.exit(1); }
              console.log('[config-gate] configuration approved');
          envFrom: &ssoEnvFrom
            - configMapRef:
                name: ghcp-common
            - configMapRef:
                name: ghcp-enterprise
            - configMapRef:
                name: ghcp-sso-config
          env: &ssoEnv
            # 生成 /metadata、/sso 的对外地址；为 https 时会话 cookie 带 Secure。
            - name: BASE_URL
              value: $(SSO_PUBLIC_BASE_URL)
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ghcp-internal
                  key: INTERNAL_API_TOKEN
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: ghcp-internal
                  key: SESSION_SECRET
            - name: SCIM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ghcp-sso
                  key: SCIM_TOKEN
            - name: GITHUB_COPILOT_SEAT_PAT
              valueFrom:
                secretKeyRef:
                  name: ghcp-sso
                  key: GITHUB_COPILOT_SEAT_PAT
            - name: SSO_DEFAULT_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ghcp-sso
                  key: SSO_DEFAULT_USER_PASSWORD
          terminationMessagePolicy: FallbackToLogsOnError
          securityContext: &restricted
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      containers:
        - name: sso
          image: ghcp-sso
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 7001
          envFrom: *ssoEnvFrom
          env: *ssoEnv
          securityContext: *restricted
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 6
          lifecycle:
            preStop:
              exec:
                command: [node, -e, "setTimeout(() => {}, 10000)"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: saml-cert
              mountPath: /certs
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ghcp-sso-data
        # 生产使用自己维护的 SAML 签名证书；文件名固定为 idp-cert.pem、idp-key.pem。
        - name: saml-cert
          secret:
            secretName: ghcp-sso-saml
            defaultMode: 0440
            items:
              - key: idp-cert.pem
                path: idp-cert.pem
              - key: idp-key.pem
                path: idp-key.pem
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ghcp-sso
  labels:
    app.kubernetes.io/name: ghcp-sso
    app.kubernetes.io/component: sso
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ghcp-sso
  ports:
    - name: http
      port: 7001
      targetPort: http
      protocol: TCP
---
# RWO 块存储（例如 Azure Disk）。不要用 NFS / Azure Files 等共享文件系统：SQLite 的文件锁在上面不可靠。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ghcp-sso-data
  labels:
    app.kubernetes.io/name: ghcp-sso
    app.kubernetes.io/component: sso
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
