# 示例：base 按名称引用的 Secret 与 MySQL CA ConfigMap。**只是占位格式，不被任何 kustomization 引用。**
# 不要把填好值的副本提交到任何仓库、工单或截图；推荐用 kubectl create secret（见 README 第 3 节）、
# 外部密钥管理（例如 Azure Key Vault + Secrets Store CSI / External Secrets）或 Sealed Secrets 创建。
# 任何值仍含 REPLACE_ 时，init 容器 require-approved-config 拒绝启动。
#
# 生成随机值的示例：openssl rand -base64 48 | tr -d '\n'
apiVersion: v1
kind: Secret
metadata:
  name: ghcp-internal
  namespace: ghcp
type: Opaque
stringData:
  # 四个服务的内部鉴权密钥（同一个值）。
  INTERNAL_API_TOKEN: REPLACE_RANDOM_INTERNAL_API_TOKEN
  # Console 会话与 `default` 企业 SSO 会话的签名密钥（SSO 与 Console 共用）。
  SESSION_SECRET: REPLACE_RANDOM_SESSION_SECRET
---
apiVersion: v1
kind: Secret
metadata:
  name: ghcp-proxy
  namespace: ghcp
type: Opaque
stringData:
  # LiteLLM 调用 Proxy 的服务密钥，只配置给 LiteLLM，不要发给最终用户。
  API_KEY: REPLACE_RANDOM_PROXY_API_KEY
  # mysql://<用户>:<URL 编码后的密码>@<主机>:<端口>/<库名>；写主库地址，不能用只读副本。
  # Azure Database for MySQL 灵活服务器的主机名形如 <服务器名>.mysql.database.azure.com。
  MYSQL_URL: mysql://REPLACE_MYSQL_USER:REPLACE_URL_ENCODED_PASSWORD@REPLACE_MYSQL_HOST:3306/REPLACE_MYSQL_DATABASE
---
apiVersion: v1
kind: Secret
metadata:
  name: ghcp-sso
  namespace: ghcp
type: Opaque
stringData:
  # GitHub 企业 SCIM token。
  SCIM_TOKEN: REPLACE_SCIM_TOKEN
  # 能管理企业 Copilot 席位并读取 billing usage 的 PAT。
  GITHUB_COPILOT_SEAT_PAT: REPLACE_SEAT_PAT
  # 账号池用户的 SSO 密码：至少 16 个字符，不能等于用户名。
  SSO_DEFAULT_USER_PASSWORD: REPLACE_RANDOM_POOL_SSO_PASSWORD
---
# SAML 签名证书与私钥（文件名固定）。生产使用自己维护的证书；scripts/gen-certs.sh 只用于开发。
apiVersion: v1
kind: Secret
metadata:
  name: ghcp-sso-saml
  namespace: ghcp
type: Opaque
stringData:
  idp-cert.pem: |
    REPLACE_PEM_CERTIFICATE
  idp-key.pem: |
    REPLACE_PEM_PRIVATE_KEY
---
# MySQL 服务器证书的 CA（公开证书，不是机密）。Azure Database for MySQL 使用其文档列出的根 CA，
# 可把多个 PEM 证书拼接在同一个 ca.pem 中。
apiVersion: v1
kind: ConfigMap
metadata:
  name: ghcp-mysql-ca
  namespace: ghcp
data:
  ca.pem: |
    REPLACE_PEM_CA_BUNDLE
